<!-- Create.html-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Autocomplete Search</title>
    <link rel="stylesheet" href="/static/Css/styles.css">
</head>
<body>

    <button id="open-btn" class="toggle-btn">☰</button>
    <div id="sidebar-overlay" class="overlay"></div>
    
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>Navigation</h3>
            <button id="close-btn" class="close-btn">&times;</button>
        </div>
        <nav class="sidebar-links">
            <a href="/">Homepage</a>
            <a href="#">Dashboard</a>
            <a href="/map">Worldmap</a>
            <a href="/create">Manual Input</a>
        </nav>
    </aside>

    <main class="main-content">
        <form class="form-container" onsubmit="event.preventDefault();">
            <h2>Airport Entry</h2>

            <div class="form-group">
                <label for="iata-input">Airport Code (IATA)</label>
                <input type="text" id="iata-input" placeholder="e.g., LAX" autocomplete="off">
                <ul id="iata-list" class="suggestion-list"></ul>
            </div>

            <div class="form-group">
                <label for="name-input">Airport Name</label>
                <input type="text" id="name-input" placeholder="e.g., Los Angeles Intl" autocomplete="off">
                <ul id="name-list" class="suggestion-list"></ul>
            </div>

            <div class="form-group">
                <label for="lat-input">Latitude</label>
                <input type="text" id="lat-input" readonly placeholder="Autofilled latitude">
            </div>

            <div class="form-group">
                <label for="lon-input">Longitude</label>
                <input type="text" id="lon-input" readonly placeholder="Autofilled longitude">
            </div>

            <div class="form-group">
                <label for="temp-input">Radar Temperature (°F)</label>
                <input type="text" id="temp-input" placeholder="e.g., 75.0">
            </div>

            <div class="form-group">
                <label for="avail-input">Availability</label>
                <select name="Availability" id="avail-input">
                    <option value="">--Select an option--
                    </option>
                    <option>Available</option>
                    <option>Partially Available</option>
                    <option>Unavailable</option>
                </select>
            </div>

            <div class="form-group">
                <label for="moni-input">Monitored Status</label>
                    <select name="Monitored" id="moni-input">
                    <option value="">--Select an option--
                    </option>
                    <option>Monitored</option>
                    <option>Unmonitored</option>
                </select>
            </div>
        </form>
    </main>
    <button id="create-button" class="toggle-btn">Create</button>
    <pre id="xml-display"></pre>

    <script src="{{ url_for('static', path='/temp.js') }}"></script>
    <script src="{{ url_for('static', path='/create.js') }}"></script>
</body>
</html>
